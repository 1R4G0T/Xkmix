<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Sorvetes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Opções de Sorvetes</h1>

        <div class="add-flavor-section">
            <input type="text" id="new-flavor" placeholder="Digite um novo sabor...">
            <button type="button" id="add-btn">Adicionar Sabor</button>
        </div>

        <form id="ice-cream-form">
            <!-- A lista de checkboxes será gerada aqui pelo JavaScript -->
            <div class="flavors-grid" id="flavors-container"></div>
            
            <button type="submit" id="submit-btn">Enviar Pedido</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
